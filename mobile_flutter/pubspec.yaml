name: beres_pos
description: "Beres POS - Offline-first POS for UMKM"
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  esc_pos_utils: ^1.1.0
  bluetooth_print: ^4.0.2
  mobile_scanner: ^7.4.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.4.0
  path_provider: ^2.1.6
  dio: ^5.11.0
  window_manager: ^0.5.2
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
dependency_overrides:
  bluetooth_print:
    path: third_party/bluetooth_print
