name: CI
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --cwd backend-workers
      - run: bun --cwd backend-workers tsc --noEmit
      - run: bun --cwd backend-workers vitest run --run
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --cwd frontend
      - run: bun --cwd frontend svelte-kit sync
      - run: bun --cwd frontend svelte-check --threshold error
      - run: bun --cwd frontend vite build
  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml
